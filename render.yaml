services:
  - type: web
    name: mubdi-api
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @mubdi/api build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8787