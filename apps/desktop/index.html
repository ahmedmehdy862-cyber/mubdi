<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>مبدع — Mubdi Social</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#c9a227; --text:#f8fafc; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', 'Cairo', sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; background:var(--panel); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #334155; }
  header h1 { margin:0; font-size:22px; }
  .badge { font-size:12px; color:var(--muted); }
  .container { display:grid; grid-template-columns: 360px 1fr; gap:16px; padding:16px; height:calc(100vh - 64px); }
  .panel { background:var(--panel); border-radius:12px; padding:16px; overflow:auto; }
  textarea { width:100%; height:120px; background:#0f172a; color:var(--text); border:1px solid #334155; border-radius:8px; padding:10px; font-size:14px; resize:vertical; }
  select, button { background:#0f172a; color:var(--text); border:1px solid #334155; border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#0f172a; border:none; font-weight:700; }
  button.primary:hover { opacity:0.9; }
  .controls { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .row { display:flex; gap:8px; }
  .variants { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .variant { background:#0f172a; border-radius:8px; padding:8px; text-align:center; }
  .variant img { width:100%; border-radius:6px; }
  .variant .actions { display:flex; gap:6px; justify-content:center; margin-top:8px; }
  .status { color:var(--muted); font-size:13px; margin-top:8px; min-height:18px; }
  .layers { font-size:12px; color:var(--muted); margin-top:8px; max-height:200px; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>مبدع — Mubdi Social</h1>
  <span class="badge">Tier 1 Native Engine</span>
</header>
<div class="container">
  <div class="panel">
    <h3>ال prompt</h3>
    <textarea id="prompt">تصميم بوست انستجرام لإعلان ملتقى تطوعي للجامعات يوم الجمعة الساعة 5 مساءً، الألوان أخضر وذهبي، بأسلوب شبابي</textarea>
    <div class="controls">
      <label>المنصة
        <select id="platform">
          <option value="ig_post_4x5">Instagram Post 4:5</option>
          <option value="ig_post_1x1">Instagram Post 1:1</option>
          <option value="ig_story">Story 9:16</option>
          <option value="x_post">X Post</option>
          <option value="yt_thumb">YouTube Thumbnail</option>
        </select>
      </label>
      <button class="primary" id="generate">توليد 3 variants</button>
      <div class="status" id="status"></div>
    </div>
    <div class="layers" id="layers"></div>
  </div>
  <div class="panel">
    <div class="variants" id="variants"></div>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
